<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roster Ledger — Personnel Directory Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12161c;
    --panel: #1a2029;
    --panel-raised: #1f2530;
    --hairline: #2a323d;
    --text: #e8eaed;
    --text-dim: #8b94a3;
    --text-faint: #5a6373;
    --brass: #a98f4a;
    --brass-dim: #6f5f38;
    --status-active: #5c8a5c;
    --status-leave: #a9824a;
    --status-transfer: #6b7a8f;
    --danger: #a55b53;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 0%, rgba(169,143,74,0.06), transparent 45%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
    color: var(--text);
    font-family: 'IBM Plex Sans KR', sans-serif;
    min-height: 100vh;
    padding: 40px 24px 80px;
  }

  .wrap {
    max-width: 980px;
    margin: 0 auto;
    position: relative;
  }

  /* Stamp signature element */
  .stamp {
    position: absolute;
    top: -6px;
    right: -6px;
    border: 2px solid var(--danger);
    color: var(--danger);
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.14em;
    padding: 6px 12px;
    transform: rotate(6deg);
    border-radius: 3px;
    opacity: 0.85;
    background: rgba(165,91,83,0.06);
    user-select: none;
    pointer-events: none;
  }
  .stamp span { display: block; font-size: 9px; letter-spacing: 0.2em; color: var(--danger); opacity: 0.75; margin-top: 2px; }

  header {
    border-bottom: 1px solid var(--hairline);
    padding-bottom: 20px;
    margin-bottom: 28px;
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--brass);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  h1 {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 34px;
    letter-spacing: 0.01em;
    margin: 0 0 6px;
    color: var(--text);
  }

  .subtitle {
    color: var(--text-dim);
    font-size: 14px;
    line-height: 1.6;
    max-width: 560px;
  }

  /* Filter panel */
  .filter-panel {
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 8px;
    padding: 18px;
    margin-bottom: 20px;
    display: grid;
    grid-template-columns: 1.4fr 0.8fr 0.8fr 0.8fr auto;
    gap: 12px;
    align-items: end;
  }

  .field label {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 6px;
  }

  .field input[type="text"],
  .field select {
    width: 100%;
    background: var(--panel-raised);
    border: 1px solid var(--hairline);
    border-radius: 5px;
    color: var(--text);
    padding: 9px 10px;
    font-size: 13.5px;
    font-family: 'IBM Plex Sans KR', sans-serif;
    outline: none;
    transition: border-color 0.15s ease;
  }
  .field input[type="text"]:focus,
  .field select:focus {
    border-color: var(--brass);
  }
  .field input[type="text"]::placeholder { color: var(--text-faint); }

  .clear-btn {
    background: transparent;
    border: 1px solid var(--hairline);
    color: var(--text-dim);
    border-radius: 5px;
    padding: 9px 14px;
    font-size: 13px;
    font-family: 'IBM Plex Sans KR', sans-serif;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s ease;
  }
  .clear-btn:hover { border-color: var(--brass-dim); color: var(--brass); }

  .meta-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    padding: 0 2px;
  }
  .result-count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-faint);
  }
  .result-count b { color: var(--brass); font-weight: 500; }

  /* Roster list */
  .roster {
    border: 1px solid var(--hairline);
    border-radius: 8px;
    overflow: hidden;
  }

  .row {
    background: var(--panel);
    border-bottom: 1px solid var(--hairline);
  }
  .row:last-child { border-bottom: none; }

  .row-main {
    display: grid;
    grid-template-columns: 90px 1fr 110px 140px 100px 32px;
    align-items: center;
    gap: 10px;
    padding: 13px 16px;
    cursor: pointer;
    transition: background 0.12s ease;
  }
  .row-main:hover { background: var(--panel-raised); }

  .col-id {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--text-faint);
  }
  .col-name {
    font-weight: 500;
    font-size: 14.5px;
  }
  .col-name .rank {
    font-size: 11.5px;
    color: var(--brass);
    font-weight: 400;
    margin-right: 6px;
  }
  .col-unit { font-size: 12.5px; color: var(--text-dim); }
  .col-mos { font-size: 12.5px; color: var(--text-dim); }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.05em;
    padding: 3px 8px;
    border-radius: 20px;
    width: fit-content;
  }
  .status-badge::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    display: inline-block;
  }
  .status-active { color: var(--status-active); background: rgba(92,138,92,0.12); }
  .status-active::before { background: var(--status-active); }
  .status-leave { color: var(--status-leave); background: rgba(169,130,74,0.12); }
  .status-leave::before { background: var(--status-leave); }
  .status-transfer { color: var(--status-transfer); background: rgba(107,122,143,0.12); }
  .status-transfer::before { background: var(--status-transfer); }

  .toggle-arrow {
    color: var(--text-faint);
    font-size: 11px;
    text-align: center;
    transition: transform 0.2s ease;
  }
  .row.open .toggle-arrow { transform: rotate(90deg); color: var(--brass); }

  .row-detail {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.22s ease;
    background: var(--panel-raised);
  }
  .row.open .row-detail { max-height: 200px; }

  .detail-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    padding: 16px;
    border-top: 1px solid var(--hairline);
  }
  .detail-item .k {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 4px;
  }
  .detail-item .v { font-size: 13px; color: var(--text); }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-faint);
  }
  .empty-state .icon { font-size: 28px; margin-bottom: 10px; opacity: 0.5; }
  .empty-state p { font-size: 13.5px; margin: 4px 0; }

  footer {
    text-align: center;
    margin-top: 32px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-faint);
    letter-spacing: 0.04em;
  }

  @media (max-width: 720px) {
    .filter-panel { grid-template-columns: 1fr 1fr; }
    .clear-btn { grid-column: span 2; }
    .row-main { grid-template-columns: 1fr 28px; grid-template-areas: "name arrow" "meta meta"; }
    .col-id, .col-unit, .col-mos { display: none; }
    .col-name { grid-area: name; }
    .toggle-arrow { grid-area: arrow; }
    .detail-grid { grid-template-columns: 1fr 1fr; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="stamp">SPECIMEN<span>DEMO DATA ONLY</span></div>

  <header>
    <div class="eyebrow">ROSTER LEDGER · UNIT DIRECTORY</div>
    <h1>인원 조회 필터 데모</h1>
    <p class="subtitle">가상의 인원 데이터로 구성한 검색·필터 기능 데모입니다. 실제 인사 정보는 포함되어 있지 않으며, 클라이언트 사이드 필터링 로직을 보여주기 위해 제작되었습니다.</p>
  </header>

  <div class="filter-panel">
    <div class="field">
      <label for="searchInput">통합 검색</label>
      <input type="text" id="searchInput" placeholder="이름, 군번, 특기 등으로 검색">
    </div>
    <div class="field">
      <label for="unitFilter">소속</label>
      <select id="unitFilter">
        <option value="">전체</option>
      </select>
    </div>
    <div class="field">
      <label for="rankFilter">계급</label>
      <select id="rankFilter">
        <option value="">전체</option>
      </select>
    </div>
    <div class="field">
      <label for="statusFilter">상태</label>
      <select id="statusFilter">
        <option value="">전체</option>
        <option value="복무중">복무중</option>
        <option value="휴가">휴가</option>
        <option value="전출대기">전출대기</option>
      </select>
    </div>
    <button class="clear-btn" id="clearBtn">필터 초기화</button>
  </div>

  <div class="meta-row">
    <div class="result-count"><b id="resultCount">0</b>명 표시 중 · 전체 <span id="totalCount">0</span>명</div>
  </div>

  <div class="roster" id="roster"></div>

  <footer>DEMO ENVIRONMENT — GENERATED PERSONNEL DATA — NOT AFFILIATED WITH ANY REAL UNIT</footer>
</div>

<script>
  // 가상 인원 데이터 (실제 정보 아님)
  const personnel = [
    { id: "25-1029384", rank: "병장", name: "김도현", unit: "1대대 2중대", mos: "보병", status: "복무중", enlist: "2024.03.11", phone: "010-XXXX-1029" },
    { id: "25-2938471", rank: "상병", name: "이재현", unit: "1대대 2중대", mos: "통신", status: "휴가", enlist: "2024.07.02", phone: "010-XXXX-2938" },
    { id: "25-3847162", rank: "일병", name: "박서준", unit: "1대대 3중대", mos: "포병", status: "복무중", enlist: "2024.11.19", phone: "010-XXXX-3847" },
    { id: "24-4756213", rank: "병장", name: "최민수", unit: "2대대 1중대", mos: "정비", status: "전출대기", enlist: "2023.09.05", phone: "010-XXXX-4756" },
    { id: "25-5687314", rank: "이병", name: "정우진", unit: "1대대 2중대", mos: "보병", status: "복무중", enlist: "2025.01.20", phone: "010-XXXX-5687" },
    { id: "24-6598472", rank: "상병", name: "한지훈", unit: "2대대 2중대", mos: "행정", status: "복무중", enlist: "2024.02.14", phone: "010-XXXX-6598" },
    { id: "25-7419583", rank: "일병", name: "오승현", unit: "3대대 1중대", mos: "통신", status: "휴가", enlist: "2024.10.08", phone: "010-XXXX-7419" },
    { id: "24-8329471", rank: "병장", name: "윤태양", unit: "3대대 1중대", mos: "포병", status: "복무중", enlist: "2023.12.01", phone: "010-XXXX-8329" },
    { id: "25-9384756", rank: "이병", name: "장현우", unit: "2대대 1중대", mos: "보병", status: "복무중", enlist: "2025.04.03", phone: "010-XXXX-9384" },
    { id: "24-1847362", rank: "상병", name: "임재원", unit: "3대대 2중대", mos: "의무", status: "전출대기", enlist: "2024.05.27", phone: "010-XXXX-1847" },
    { id: "25-2756483", rank: "일병", name: "강태민", unit: "1대대 3중대", mos: "행정", status: "복무중", enlist: "2024.09.14", phone: "010-XXXX-2756" },
    { id: "24-3647591", rank: "병장", name: "송민재", unit: "2대대 2중대", mos: "정비", status: "휴가", enlist: "2023.11.30", phone: "010-XXXX-3647" }
  ];

  const rosterEl = document.getElementById('roster');
  const searchInput = document.getElementById('searchInput');
  const unitFilter = document.getElementById('unitFilter');
  const rankFilter = document.getElementById('rankFilter');
  const statusFilter = document.getElementById('statusFilter');
  const clearBtn = document.getElementById('clearBtn');
  const resultCount = document.getElementById('resultCount');
  const totalCount = document.getElementById('totalCount');

  const statusClassMap = { "복무중": "status-active", "휴가": "status-leave", "전출대기": "status-transfer" };

  // select 옵션 자동 생성 (데이터에서 고유값 추출)
  function populateSelect(selectEl, values) {
    [...new Set(values)].sort().forEach(v => {
      const opt = document.createElement('option');
      opt.value = v;
      opt.textContent = v;
      selectEl.appendChild(opt);
    });
  }
  populateSelect(unitFilter, personnel.map(p => p.unit));
  populateSelect(rankFilter, personnel.map(p => p.rank));

  function renderRoster(list) {
    rosterEl.innerHTML = '';
    if (list.length === 0) {
      rosterEl.innerHTML = `
        <div class="empty-state">
          <div class="icon">&#128269;</div>
          <p>조건에 맞는 인원이 없습니다.</p>
          <p>검색어나 필터 조건을 확인해보세요.</p>
        </div>`;
      return;
    }

    list.forEach(p => {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `
        <div class="row-main">
          <div class="col-id">${p.id}</div>
          <div class="col-name"><span class="rank">${p.rank}</span>${p.name}</div>
          <div class="col-unit">${p.unit}</div>
          <div class="col-mos">${p.mos}</div>
          <div><span class="status-badge ${statusClassMap[p.status]}">${p.status}</span></div>
          <div class="toggle-arrow">&#9654;</div>
        </div>
        <div class="row-detail">
          <div class="detail-grid">
            <div class="detail-item"><div class="k">군번</div><div class="v">${p.id}</div></div>
            <div class="detail-item"><div class="k">입대일</div><div class="v">${p.enlist}</div></div>
            <div class="detail-item"><div class="k">연락처</div><div class="v">${p.phone}</div></div>
            <div class="detail-item"><div class="k">특기</div><div class="v">${p.mos}</div></div>
          </div>
        </div>`;
      row.querySelector('.row-main').addEventListener('click', () => {
        row.classList.toggle('open');
      });
      rosterEl.appendChild(row);
    });
  }

  function applyFilter() {
    const keyword = searchInput.value.trim().toLowerCase();
    const unit = unitFilter.value;
    const rank = rankFilter.value;
    const status = statusFilter.value;

    const filtered = personnel.filter(p => {
      const haystack = `${p.id} ${p.rank} ${p.name} ${p.unit} ${p.mos} ${p.status}`.toLowerCase();
      const matchKeyword = keyword === '' || haystack.includes(keyword);
      const matchUnit = unit === '' || p.unit === unit;
      const matchRank = rank === '' || p.rank === rank;
      const matchStatus = status === '' || p.status === status;
      return matchKeyword && matchUnit && matchRank && matchStatus;
    });

    renderRoster(filtered);
    resultCount.textContent = filtered.length;
  }

  [searchInput, unitFilter, rankFilter, statusFilter].forEach(el => {
    el.addEventListener('input', applyFilter);
    el.addEventListener('change', applyFilter);
  });

  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    unitFilter.value = '';
    rankFilter.value = '';
    statusFilter.value = '';
    applyFilter();
  });

  totalCount.textContent = personnel.length;
  applyFilter();
</script>
</body>
</html>
